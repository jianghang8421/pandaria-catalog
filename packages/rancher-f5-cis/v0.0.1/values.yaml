image:
  repository: "f5networks/k8s-bigip-ctlr"
  tag: "2.13.1"
  pullPolicy: IfNotPresent
bigip_secret:
  username:
  password:
args:
  # See https://clouddocs.f5.com/containers/latest/userguide/config-parameters.html
  # NOTE: helm has difficulty with values using `-`; `_` are used for naming
  # and are replaced with `-` during rendering.
  # REQUIRED Params
  bigip_url: ""
  bigip_partition: ""
  custom-resource-mode: true
  insecure: true
  # OPTIONAL PARAMS -- uncomment and provide values for those you wish to use.
  # trusted_certs_cfgmap
  # verify_interval:
  # node-poll_interval:
  # log_level:
  # python_basedir: ~
  # VXLAN
  # openshift_sdn_name:
  # flannel_name:
  # KUBERNETES
  # default_ingress_ip:
  # kubeconfig:
  # namespaces: ["foo", "bar"]
  # namespace_label:
  # node_label_selector:
  # pool_member_type:
  # resolve_ingress_names:
  # running_in_cluster:
  # use_node_internal:
  # use_secrets:
  # log-as3-response: true
  # gtm-bigip-password
  # gtm-bigip-url
  # gtm-bigip-username

network:
  type: ""
  poolMemberType: ""
  flannelName: ""
ipam:
  enable: false
  image:
    repository: "cnrancher/f5-ipam-controller"
    tag: "0.1.9"
  volume:
    pvc: ""
  ipRange:
    #key: value
# affinity:
