apiVersion: v1
data:
  password: {{ .Values.bigip_secret.password | toString | b64enc | quote }}
  username: {{ .Values.bigip_secret.username | toString | b64enc | quote }}
kind: Secret
metadata:
  name: bigip-login
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
